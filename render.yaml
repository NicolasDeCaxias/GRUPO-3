services:
  - type: web
    name: bibliotech-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/salud
    envVars:
      - key: FRONTEND_URL
        sync: false
  - type: web
    name: bibliotech-frontend
    runtime: static
    rootDir: frontend
    buildCommand: echo "sitio estatico"
    staticPublishPath: .
