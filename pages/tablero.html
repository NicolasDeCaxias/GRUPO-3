<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BiblioTech | Tablero</title>

    <link rel="stylesheet" href="../css/styles.css">
</head>

<body data-pagina="tablero">

    <!-- Encabezado -->
    <header>

        <img src="../images/logo_bibliotech.png" alt="Logo de BiblioTech">

        <h1>BiblioTech</h1>

        <p>
            Biblioteca Provincial "Manuel Belgrano"
        </p>

    </header>


    <!-- Menú de navegación (generado por JavaScript según el rol) -->
    <nav>
        <ul id="menu"></ul>
    </nav>


    <!-- Contenido principal -->
    <main>

        <section>
            <h2>Tablero de control</h2>
            <p>Estado de los libros y actividad de los socios.</p>
            <div id="indicadores" class="indicadores"></div>
        </section>

        <section>
            <h2>Categorías más leídas</h2>
            <div id="categorias"></div>
        </section>

        <section>
            <h2>Libros que faltan en el inventario</h2>
            <div id="libros-faltantes"></div>
        </section>

        <section>
            <h2>Actividad de los socios</h2>
            <div id="actividad-socios"></div>
        </section>
    </main>


    <!-- Pie de página -->
    <footer>

        <p>
            &copy; 2026 BiblioTech - Biblioteca Provincial
            "Manuel Belgrano"
        </p>

    </footer>

    <script src="../data/datos.js"></script>
    <script src="../js/scripts.js"></script>

</body>

</html>
